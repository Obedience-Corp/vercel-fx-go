name: Bug report
description: Report reproducible SDK behavior that appears incorrect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source, or raw fx state.
  - type: input
    id: sdk_version
    attributes:
      label: SDK version
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: fx_version
    attributes:
      label: fx version
      description: Output of `fx --version`.
    validations:
      required: true
  - type: input
    id: go_version
    attributes:
      label: Go version and operating system
      placeholder: go1.26.0, linux/amd64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe program and exact commands needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This is not a security vulnerability. I will use the private channel in SECURITY.md for vulnerabilities.
          required: true
